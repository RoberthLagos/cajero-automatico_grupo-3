<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>ATM - Menú Principal</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>

<h:body>
    <div class="atm-card">
        <h:form id="loginForm">
            <p:growl id="messages" showDetail="true" life="4000" />

            <div class="atm-logo">
                <i class="pi pi-shield"></i>
            </div>
            <h2>BANK UTH</h2>
            
            <div class="ui-fluid">
                <div style="margin-bottom: 25px; text-align: left;">
                    <p:outputLabel for="cuenta" value="Número de Tarjeta" style="font-size: 12px; color: #aaa; margin-left: 5px;"/>
                    <p:inputText id="cuenta" value="#{loginBean.cuentaIngresada}" 
                                 placeholder="0000 0000 0000 0000" required="true" />
                </div>

                <div style="margin-bottom: 10px; text-align: left;">
                    <p:outputLabel for="pin" value="PIN de Seguridad" style="font-size: 12px; color: #aaa; margin-left: 5px;"/>
                    <p:password id="pin" value="#{loginBean.pinIngresado}" 
                                placeholder="****" required="true" toggleMask="true" />
                </div>
            </div>

            <p:commandButton value="AUTENTICAR" 
                 action="#{loginBean.ingresar()}" 
                 update="messages" 
                 styleClass="btn-login" 
                 icon="pi pi-fingerprint" />
            
            <p style="margin-top: 25px; font-size: 11px; color: #666;">
                Conexión segura SSL - 2026
            </p>
        </h:form>
    </div>
</h:body>
</html>
