<ui:composition template="/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">Depósito - BANK UTH</ui:define>

    <ui:define name="content">
        <div style="text-align: center; padding: 10px;">
            <div style="margin-bottom: 20px;">
                <h2 style="color: #0f172a; margin: 0;">DEPÓSITO</h2>
                <span style="color: #64748b; font-size: 0.9rem;">Transacción Segura</span>
            </div>

            <p:separator/>


            <div style="text-align: left; margin-bottom: 15px;">
                <p:outputLabel for="pin" value="Ingrese su PIN de Seguridad" 
                               style="display:block; margin-bottom: 2px; font-weight: bold; color: #334155;"/>
                <p:password id="pin" value="#{cajerobeans.pinIngresado}" 
                            toggleMask="true" redisplay="true"
                            placeholder="****" style="width: 100%"/>
            </div>

            <div style="text-align: left; margin-bottom: 15px;">
                <p:outputLabel for="monto" value="Monto a Depositar" 
                               style="display:block; margin-bottom: 2px; font-weight: bold; color: #334155;"/>
                <p:inputNumber id="monto" value="#{cajerobeans.montoTransaccion}" 
                               symbol="L " decimalSeparator="." thousandSeparator=","
                               placeholder="0.00" style="width: 100%"/>
            </div>

            <p:commandButton value="CONFIRMAR DEPÓSITO" 
                             action="#{cajerobeans.depositar()}" 
                             update="@form"
                             style="width: 100%; height: 40px; font-weight: bold; background: #3b82f6; border: none; border-radius: 12px; color: white;"/>

            <p:commandButton value="CANCELAR Y VOLVER" 
                             action="menu?faces-redirect=true" 
                             immediate="true"
                             styleClass="ui-button-flat" 
                             style="width: 100%; margin-top: 15px; color: #ef4444; font-weight: bold;"/>
            
            <p:separator style="margin-top: 15px;"/>
        </div>
    </ui:define>

</ui:composition>
